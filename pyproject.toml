[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recon-occlusion"
version = "0.1.0"
description = "Utilities for preparing occluded face images, running Deep3DFaceRecon, and evaluating reconstructions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
  "Pillow>=10",
  "torch>=2.0",
  "torchvision>=0.15",
  "scikit-image>=0.21",
  "trimesh>=4.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
landmarks = ["mtcnn>=0.1.1", "face-alignment>=1.4"]
notebook = ["matplotlib>=3.7", "ipython>=8"]

[tool.setuptools.packages.find]
where = ["src"]
